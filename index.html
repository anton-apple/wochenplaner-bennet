<style>
  :root {
    --bg: #F4F6F1;
    --paper: #FFFFFF;
    --ink: #1D2B28;
    --ink-soft: #5C6D68;
    --line: #DCE3DC;
    --gold: #E8B84B;
    --school: #3B5BA5;
    --school-soft: #E8ECF6;
    --sport: #D9502E;
    --sport-soft: #FBEAE4;
    --alltag: #8A6BBE;
    --alltag-soft: #F0EBF9;
    --freizeit: #2F9E7D;
    --freizeit-soft: #E6F4EF;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 28px 28px;
    background-attachment: fixed;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 20px 120px;
  }

  /* ---------- Header ---------- */
  .app-header {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 18px;
    margin-bottom: 28px;
  }

  .brand-eyebrow {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }

  .brand h1 {
    font-family: 'Fraunces', serif;
    font-weight: 650;
    font-size: 40px;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .week-nav {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 8px;
  }

  .week-nav button {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: var(--bg);
    color: var(--ink);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s;
  }
  .week-nav button:hover { background: var(--gold); }

  .week-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--ink);
    min-width: 132px;
    text-align: center;
  }

  .today-btn, .ghost-btn {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    border-radius: 999px;
    padding: 9px 16px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    transition: transform .15s, background .15s;
  }
  .ghost-btn { border-color: var(--ink); }
  .today-btn:hover, .ghost-btn:hover { background: var(--gold); border-color: var(--gold); transform: translateY(-1px); }

  /* ---------- Board ---------- */
  .board {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 12px;
    align-items: start;
  }

  .day {
    position: relative;
    margin-top: 22px;
  }

  .day-tab {
    position: absolute;
    top: -22px;
    left: 10px;
    padding: 5px 12px 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--paper);
    background: var(--ink-soft);
    clip-path: polygon(8% 0, 92% 0, 100% 100%, 0% 100%);
  }
  .day.is-today .day-tab { background: var(--gold); color: var(--ink); font-weight: 700; }

  .day-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 12px 12px;
    min-height: 220px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .day.is-today .day-card { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }

  .day-date {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 650;
    color: var(--ink);
    line-height: 1;
  }
  .day-date span { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500; color: var(--ink-soft); letter-spacing: 0.1em; margin-bottom: 2px; }

  .activities {
    display: flex;
    flex-direction: column;
    gap: 7px;
    flex: 1;
  }

  .activity {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 7px 8px;
    border-radius: 9px;
    background: var(--bg);
    border: 1px solid transparent;
  }
  .activity.done { opacity: 0.55; }
  .activity.done .activity-title { text-decoration: line-through; }

  .activity-check {
    width: 17px;
    height: 17px;
    border-radius: 5px;
    border: 1.5px solid var(--ink-soft);
    background: var(--paper);
    flex-shrink: 0;
    margin-top: 1px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .activity-check.checked { background: var(--freizeit); border-color: var(--freizeit); color: white; font-size: 11px; }

  .activity-body { flex: 1; min-width: 0; }
  .activity-title { font-size: 13px; font-weight: 500; word-break: break-word; }
  .activity-meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
  .cat-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .activity-time { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--ink-soft); }
  .cat-label { font-size: 10px; color: var(--ink-soft); }

  .activity-del {
    border: none;
    background: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 2px 4px;
    flex-shrink: 0;
    border-radius: 5px;
  }
  .activity-del:hover { background: var(--sport-soft); color: var(--sport); }

  .add-btn {
    border: 1.5px dashed var(--line);
    background: transparent;
    color: var(--ink-soft);
    border-radius: 9px;
    padding: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .add-btn:hover { border-color: var(--ink); color: var(--ink); }

  .empty-hint { font-size: 11.5px; color: var(--ink-soft); font-style: italic; padding: 4px 2px; }

  /* ---------- Inline add form ---------- */
  .add-form {
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding: 9px;
    background: var(--bg);
    border-radius: 9px;
    border: 1px solid var(--line);
  }
  .add-form input[type="text"], .add-form input[type="time"] {
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    padding: 7px 8px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    width: 100%;
  }
  .add-form input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }

  .cat-picker { display: flex; gap: 5px; flex-wrap: wrap; }
  .cat-chip {
    font-size: 10.5px;
    font-weight: 600;
    padding: 5px 9px;
    border-radius: 999px;
    border: 1.5px solid transparent;
    cursor: pointer;
    color: var(--ink);
  }
  .cat-chip[data-cat="schule"] { background: var(--school-soft); }
  .cat-chip[data-cat="sport"] { background: var(--sport-soft); }
  .cat-chip[data-cat="alltag"] { background: var(--alltag-soft); }
  .cat-chip[data-cat="freizeit"] { background: var(--freizeit-soft); }
  .cat-chip.active { border-color: var(--ink); }

  .form-row { display: flex; gap: 6px; }
  .form-actions { display: flex; gap: 6px; justify-content: flex-end; }
  .form-actions button {
    font-size: 11.5px;
    font-weight: 600;
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--paper);
  }
  .form-actions .save { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  /* ---------- Stats ---------- */
  .stats {
    margin-top: 34px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px 24px;
  }
  .stats-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
  .stats-title { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 650; }
  .stats-total { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--ink-soft); }
  .stats-total b { color: var(--ink); font-size: 15px; }

  .stat-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .stat-name { width: 78px; font-size: 12.5px; font-weight: 600; flex-shrink: 0; }
  .stat-track { flex: 1; height: 10px; background: var(--bg); border-radius: 999px; overflow: hidden; }
  .stat-fill { height: 100%; border-radius: 999px; transition: width .3s; }
  .stat-count { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-soft); width: 58px; text-align: right; flex-shrink: 0; }

  .loading, .empty-week {
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
    padding: 40px;
  }

  @media (max-width: 980px) {
    .board { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px) {
    .board { grid-template-columns: 1fr; }
    .brand h1 { font-size: 30px; }
    .app-header { flex-direction: column; align-items: flex-start; }
  }

  /* ---------- Tipp-Leiste ---------- */
  .tip-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--ink);
    border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }

  .tip-bar-inner {
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .tip-bar-label {
    flex-shrink: 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--gold);
    writing-mode: horizontal-tb;
  }

  .tip-scroller {
    flex: 1;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 2px 0;
  }
  .tip-scroller::-webkit-scrollbar { display: none; }

  .tip-card {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    background: #2A3A36;
    border: 1px solid #3B4B46;
    border-radius: 999px;
    padding: 7px 8px 7px 12px;
    max-width: 340px;
  }

  .tip-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .tip-text { font-size: 12px; color: #EDF1EE; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .tip-add {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: none;
    background: var(--gold);
    color: var(--ink);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .15s;
  }
  .tip-add:hover { transform: scale(1.1); }
  .tip-add.added { background: var(--freizeit); color: white; }

  .tip-shuffle {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid #3B4B46;
    background: transparent;
    color: #EDF1EE;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tip-shuffle:hover { border-color: var(--gold); color: var(--gold); }

  @media (max-width: 700px) {
    .tip-bar-label { display: none; }
    .tip-card { max-width: 240px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="brand">
      <span class="brand-eyebrow">MEIN PLANER</span>
      <h1>Wochenplan</h1>
    </div>
    <div class="header-controls">
      <div class="week-nav">
        <button id="prevWeek" aria-label="Vorherige Woche">←</button>
        <div class="week-label" id="weekLabel">–</div>
        <button id="nextWeek" aria-label="Nächste Woche">→</button>
      </div>
      <button class="today-btn" id="todayBtn">Heute</button>
      <button class="ghost-btn" id="copyWeekBtn">Woche kopieren →</button>
    </div>
  </header>

  <div id="board" class="board"></div>

  <section class="stats">
    <div class="stats-header">
      <span class="stats-title">Diese Woche</span>
      <span class="stats-total" id="statsTotal"><b>0</b> von 0 erledigt</span>
    </div>
    <div id="statsBody"></div>
  </section>
</div>

<div class="tip-bar">
  <div class="tip-bar-inner">
    <span class="tip-bar-label">HEUTE&nbsp;TIPP</span>
    <div class="tip-scroller" id="tipScroller"></div>
    <button class="tip-shuffle" id="tipShuffle" aria-label="Neue Vorschläge">⟳</button>
  </div>
</div>

<script>
const CATS = {
  schule:   { label: "Schule",   color: "var(--school)" },
  sport:    { label: "Sport",    color: "var(--sport)" },
  alltag:   { label: "Alltag",   color: "var(--alltag)" },
  freizeit: { label: "Freizeit", color: "var(--freizeit)" }
};
const WEEKDAYS = ["Mo","Di","Mi","Do","Fr","Sa","So"];
const MONTHS = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const STORAGE_KEY = "wochenplan-state";

const TIPS = [
  { text: "30 Minuten vor dem Schlafen: kein Handy mehr.", cat: "alltag" },
  { text: "Handy in einen anderen Raum legen, während du lernst.", cat: "schule" },
  { text: "Vor dem Training kurz dehnen oder aufwärmen.", cat: "sport" },
  { text: "Trinkflasche griffbereit hinstellen und öfter trinken.", cat: "alltag" },
  { text: "Größte Aufgabe des Tages zuerst angehen.", cat: "schule" },
  { text: "20 Minuten am Stück ohne Ablenkung lernen, dann Pause.", cat: "schule" },
  { text: "Nach dem Sport kurz dehnen, damit du morgen fit bist.", cat: "sport" },
  { text: "Schulsachen für morgen schon heute Abend packen.", cat: "schule" },
  { text: "10 Minuten früher aufstehen, ohne direkt aufs Handy zu schauen.", cat: "alltag" },
  { text: "Ein Kapitel lesen statt kurz durchs Handy zu scrollen.", cat: "freizeit" },
  { text: "Nach dem Essen kurz an die frische Luft gehen.", cat: "alltag" },
  { text: "Handy beim Lernen auf lautlos und Display nach unten.", cat: "schule" },
  { text: "Ein Glas Wasser direkt nach dem Aufstehen trinken.", cat: "alltag" },
  { text: "5 Minuten aufräumen, bevor du dich hinsetzt zu lernen.", cat: "schule" },
  { text: "Ruhetag? Kurzer Spaziergang hält den Kreislauf trotzdem in Schwung.", cat: "sport" },
  { text: "Tagesschau oder Nachrichten bewusst statt nebenbei schauen.", cat: "freizeit" },
  { text: "Drei Dinge aufschreiben, die heute gut liefen.", cat: "alltag" },
  { text: "Vor dem Training kurz aufschreiben, was du schaffen willst.", cat: "sport" },
  { text: "Handy-Benachrichtigungen für eine Stunde stummschalten.", cat: "alltag" },
  { text: "Nach der Schule 15 Minuten bewegen, bevor du Hausaufgaben machst.", cat: "sport" },
  { text: "Für morgen nur die 3 wichtigsten Aufgaben notieren.", cat: "schule" },
  { text: "Statt Serie schauen: eine Folge weniger, dafür früher schlafen.", cat: "alltag" },
  { text: "Kurze Dehnübung direkt nach dem Aufstehen.", cat: "sport" },
  { text: "Beim Lernen Timer stellen statt endlos weiterzumachen.", cat: "schule" },
  { text: "Ein Buch oder Artikel lesen statt kurz vorm Schlafen zu scrollen.", cat: "freizeit" },
  { text: "Nach dem Sport bewusst 5 Minuten runterkommen, statt sofort aufs Handy.", cat: "sport" },
  { text: "Kurze Pause machen und rausschauen statt aufs Display.", cat: "schule" },
  { text: "Wasserflasche mit zur Schule nehmen.", cat: "alltag" },
  { text: "Vor dem Schlafen kurz notieren, was morgen ansteht.", cat: "alltag" },
  { text: "Ein Hobby-Ding tun, das nichts mit einem Bildschirm zu tun hat.", cat: "freizeit" }
];

function seededIndices(seedStr, count, poolSize) {
  let seed = 0;
  for (let i = 0; i < seedStr.length; i++) seed = (seed * 31 + seedStr.charCodeAt(i)) >>> 0;
  const rand = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const pool = Array.from({ length: poolSize }, (_, i) => i);
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, count);
}

let currentTips = [];

function loadDailyTips() {
  const idx = seededIndices(isoDate(new Date()), 4, TIPS.length);
  currentTips = idx.map(i => TIPS[i]);
}

function shuffleTips() {
  const idx = seededIndices(Math.random().toString(), 4, TIPS.length);
  currentTips = idx.map(i => TIPS[i]);
  renderTips();
}

function renderTips() {
  const scroller = document.getElementById("tipScroller");
  scroller.innerHTML = "";
  currentTips.forEach(tip => {
    const card = document.createElement("div");
    card.className = "tip-card";

    const dot = document.createElement("span");
    dot.className = "tip-dot";
    dot.style.background = CATS[tip.cat] ? CATS[tip.cat].color : "var(--gold)";
    card.appendChild(dot);

    const text = document.createElement("span");
    text.className = "tip-text";
    text.textContent = tip.text;
    card.appendChild(text);

    const addBtn = document.createElement("button");
    addBtn.className = "tip-add";
    addBtn.textContent = "+";
    addBtn.title = "Zu heute hinzufügen";
    addBtn.onclick = () => {
      addTipToToday(tip);
      addBtn.textContent = "✓";
      addBtn.classList.add("added");
      addBtn.disabled = true;
    };
    card.appendChild(addBtn);

    scroller.appendChild(card);
  });
}

function addTipToToday(tip) {
  const todayDate = new Date();
  const monday = getMonday(todayDate);
  const key = weekKey(monday);
  const dayIdx = (todayDate.getDay() + 6) % 7;
  ensureWeek(key)[dayIdx].push({
    id: uid(),
    title: tip.text,
    category: tip.cat,
    time: null,
    done: false
  });
  saveState();
  if (weekKey(currentMonday) === key) render();
}

let state = { weeks: {} };
let currentMonday = getMonday(new Date());
let openFormDay = null;

function pad(n) { return n < 10 ? "0"+n : ""+n; }
function isoDate(d) { return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function getMonday(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  date.setDate(date.getDate() + diff);
  date.setHours(0,0,0,0);
  return date;
}
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function weekKey(monday) { return isoDate(monday); }
function uid() { return Math.random().toString(36).slice(2,10); }

function ensureWeek(key) {
  if (!state.weeks[key]) {
    state.weeks[key] = [[],[],[],[],[],[],[]];
  }
  return state.weeks[key];
}

async function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.weeks) state = parsed;
    }
  } catch (e) {
    // no saved state yet, or storage unavailable
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.error("Speichern fehlgeschlagen", e);
  }
}

function formatWeekLabel(monday) {
  const sunday = addDays(monday, 6);
  const sameMonth = monday.getMonth() === sunday.getMonth();
  if (sameMonth) {
    return `${monday.getDate()}.–${sunday.getDate()}. ${MONTHS[monday.getMonth()]}`;
  }
  return `${monday.getDate()}. ${MONTHS[monday.getMonth()]} – ${sunday.getDate()}. ${MONTHS[sunday.getMonth()]}`;
}

function render() {
  const key = weekKey(currentMonday);
  ensureWeek(key);
  document.getElementById("weekLabel").textContent = formatWeekLabel(currentMonday);
  renderBoard(key);
  renderStats(key);
}

function renderBoard(key) {
  const board = document.getElementById("board");
  board.innerHTML = "";
  const todayIso = isoDate(new Date());
  const days = state.weeks[key];

  WEEKDAYS.forEach((wd, i) => {
    const dayDate = addDays(currentMonday, i);
    const dIso = isoDate(dayDate);
    const isToday = dIso === todayIso;

    const dayEl = document.createElement("div");
    dayEl.className = "day" + (isToday ? " is-today" : "");

    const tab = document.createElement("div");
    tab.className = "day-tab";
    tab.textContent = wd;
    dayEl.appendChild(tab);

    const card = document.createElement("div");
    card.className = "day-card";

    const dateEl = document.createElement("div");
    dateEl.className = "day-date";
    dateEl.innerHTML = `<span>${MONTHS[dayDate.getMonth()]}</span>${dayDate.getDate()}`;
    card.appendChild(dateEl);

    const list = document.createElement("div");
    list.className = "activities";

    const acts = days[i];
    if (acts.length === 0 && openFormDay !== i) {
      const hint = document.createElement("div");
      hint.className = "empty-hint";
      hint.textContent = "Noch nichts geplant.";
      list.appendChild(hint);
    }

    acts.forEach(act => {
      list.appendChild(renderActivity(act, key, i));
    });

    card.appendChild(list);

    if (openFormDay === i) {
      card.appendChild(renderAddForm(key, i));
    } else {
      const addBtn = document.createElement("button");
      addBtn.className = "add-btn";
      addBtn.textContent = "+ Hinzufügen";
      addBtn.onclick = () => { openFormDay = i; render(); };
      card.appendChild(addBtn);
    }

    dayEl.appendChild(card);
    board.appendChild(dayEl);
  });
}

function renderActivity(act, key, dayIdx) {
  const el = document.createElement("div");
  el.className = "activity" + (act.done ? " done" : "");

  const check = document.createElement("button");
  check.className = "activity-check" + (act.done ? " checked" : "");
  check.innerHTML = act.done ? "✓" : "";
  check.onclick = () => {
    act.done = !act.done;
    saveState();
    render();
  };
  el.appendChild(check);

  const body = document.createElement("div");
  body.className = "activity-body";

  const title = document.createElement("div");
  title.className = "activity-title";
  title.textContent = act.title;
  body.appendChild(title);

  const meta = document.createElement("div");
  meta.className = "activity-meta";
  const dot = document.createElement("span");
  dot.className = "cat-dot";
  dot.style.background = CATS[act.category] ? CATS[act.category].color : "var(--ink-soft)";
  meta.appendChild(dot);
  const catLabel = document.createElement("span");
  catLabel.className = "cat-label";
  catLabel.textContent = CATS[act.category] ? CATS[act.category].label : "";
  meta.appendChild(catLabel);
  if (act.time) {
    const time = document.createElement("span");
    time.className = "activity-time";
    time.textContent = "· " + act.time;
    meta.appendChild(time);
  }
  body.appendChild(meta);
  el.appendChild(body);

  const del = document.createElement("button");
  del.className = "activity-del";
  del.innerHTML = "✕";
  del.setAttribute("aria-label", "Löschen");
  del.onclick = () => {
    const arr = state.weeks[key][dayIdx];
    state.weeks[key][dayIdx] = arr.filter(a => a.id !== act.id);
    saveState();
    render();
  };
  el.appendChild(del);

  return el;
}

function renderAddForm(key, dayIdx) {
  const form = document.createElement("div");
  form.className = "add-form";
  let selectedCat = "alltag";

  const titleInput = document.createElement("input");
  titleInput.type = "text";
  titleInput.placeholder = "z.B. Lesen, Training, Hausaufgaben...";
  titleInput.maxLength = 60;

  const picker = document.createElement("div");
  picker.className = "cat-picker";
  Object.keys(CATS).forEach(catKey => {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "cat-chip" + (catKey === selectedCat ? " active" : "");
    chip.dataset.cat = catKey;
    chip.textContent = CATS[catKey].label;
    chip.onclick = () => {
      selectedCat = catKey;
      picker.querySelectorAll(".cat-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
    };
    picker.appendChild(chip);
  });

  const row = document.createElement("div");
  row.className = "form-row";
  const timeInput = document.createElement("input");
  timeInput.type = "time";
  row.appendChild(timeInput);

  const actions = document.createElement("div");
  actions.className = "form-actions";
  const cancelBtn = document.createElement("button");
  cancelBtn.textContent = "Abbrechen";
  cancelBtn.onclick = () => { openFormDay = null; render(); };
  const saveBtn = document.createElement("button");
  saveBtn.className = "save";
  saveBtn.textContent = "Speichern";
  saveBtn.onclick = () => {
    const val = titleInput.value.trim();
    if (!val) { titleInput.focus(); return; }
    ensureWeek(key)[dayIdx].push({
      id: uid(),
      title: val,
      category: selectedCat,
      time: timeInput.value || null,
      done: false
    });
    openFormDay = null;
    saveState();
    render();
  };
  actions.appendChild(cancelBtn);
  actions.appendChild(saveBtn);

  form.appendChild(titleInput);
  form.appendChild(picker);
  form.appendChild(row);
  form.appendChild(actions);

  setTimeout(() => titleInput.focus(), 0);
  titleInput.addEventListener("keydown", e => { if (e.key === "Enter") saveBtn.click(); });

  return form;
}

function renderStats(key) {
  const days = state.weeks[key];
  const all = days.flat();
  const total = all.length;
  const done = all.filter(a => a.done).length;
  document.getElementById("statsTotal").innerHTML = `<b>${done}</b> von ${total} erledigt`;

  const body = document.getElementById("statsBody");
  body.innerHTML = "";

  if (total === 0) {
    const empty = document.createElement("div");
    empty.className = "empty-week";
    empty.textContent = "Noch keine Aktivitäten diese Woche — leg direkt oben los.";
    body.appendChild(empty);
    return;
  }

  const maxCount = Math.max(...Object.keys(CATS).map(c => all.filter(a => a.category === c).length), 1);

  Object.keys(CATS).forEach(catKey => {
    const catActs = all.filter(a => a.category === catKey);
    const catDone = catActs.filter(a => a.done).length;
    const row = document.createElement("div");
    row.className = "stat-row";

    const name = document.createElement("div");
    name.className = "stat-name";
    name.textContent = CATS[catKey].label;
    row.appendChild(name);

    const track = document.createElement("div");
    track.className = "stat-track";
    const fill = document.createElement("div");
    fill.className = "stat-fill";
    fill.style.background = CATS[catKey].color;
    fill.style.width = catActs.length ? (catActs.length / maxCount * 100) + "%" : "0%";
    track.appendChild(fill);
    row.appendChild(track);

    const count = document.createElement("div");
    count.className = "stat-count";
    count.textContent = `${catDone}/${catActs.length}`;
    row.appendChild(count);

    body.appendChild(row);
  });
}

function copyWeek() {
  const srcKey = weekKey(currentMonday);
  const src = state.weeks[srcKey];
  if (!src || src.flat().length === 0) return;
  const nextMonday = addDays(currentMonday, 7);
  const destKey = weekKey(nextMonday);
  state.weeks[destKey] = src.map(day => day.map(act => ({
    id: uid(),
    title: act.title,
    category: act.category,
    time: act.time,
    done: false
  })));
  saveState();
  currentMonday = nextMonday;
  render();
}

document.getElementById("prevWeek").onclick = () => { currentMonday = addDays(currentMonday, -7); openFormDay = null; render(); };
document.getElementById("nextWeek").onclick = () => { currentMonday = addDays(currentMonday, 7); openFormDay = null; render(); };
document.getElementById("todayBtn").onclick = () => { currentMonday = getMonday(new Date()); openFormDay = null; render(); };
document.getElementById("copyWeekBtn").onclick = copyWeek;
document.getElementById("tipShuffle").onclick = shuffleTips;

(async function init() {
  document.getElementById("board").innerHTML = '<div class="loading">Lade deinen Plan...</div>';
  loadDailyTips();
  renderTips();
  await loadState();
  render();
})();
</script>
</body>
</html>
